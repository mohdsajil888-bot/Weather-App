<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>🌤 Weather Dashboard</h1>

            <button id="themeBtn">🌙 Dark</button>
        </header>


        <!-- Search -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">Search</button>

        </div>


        <!-- Loading -->
        <div id="loading">
            Loading...
        </div>


        <!-- Error -->
        <div id="errorMsg"></div>


        <!-- Current Weather -->
        <div id="weatherCard" class="weather-card">

            <h2 id="cityName"></h2>

            <img id="weatherIcon" src="" alt="Weather">

            <h3>
                <span id="temperature"></span>°C
            </h3>

            <p id="description"></p>

            <p>
                Feels like: <span id="feelsLike"></span>°C
            </p>

            <p>
                Humidity: <span id="humidity"></span>%
            </p>

            <p>
                Wind: <span id="windSpeed"></span> m/s
            </p>

            <button id="favoriteBtn">
                ⭐ Add to Favorites
            </button>

        </div>
        <!-- Favorites -->
        <div class="favorites">

            <h2>⭐ Favorites</h2>

            <div id="favoritesList"></div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
